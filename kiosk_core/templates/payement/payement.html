{% extends 'base/base.html' %}
{% load static %}

{% block content %}
    
    
 <main class="container">
      <div class="main-payement", id="main-payement">
        <section>
          <div class="card-panel z-depth-1 blue lighten-5">
            <span class="dark-text"
              >You can insert the amount of {{ amount }}€ bills at the device.
              <span id="paymentMethod"></span>
            </span>
          </div>
          <div class="progressBar">
            <div class="bar" id="progressBar">
              <div class="progress-value"></div>
            </div>
          </div>
          <div class="card-panel-currentAmount z-depth-1 blue lighten-5">
            <span class="dark-text">
                Actual amount added : 
                    <span id="currentAmount">
                    {% if given_bill is none %}
                        0
                    {% else %}
                        {{ given_bill }}
                    {% endif %}
                    </span>€
            </span>
          </div>

          <div class="spinner-box">
            <div class="spinner" id="spinner"></div>
          </div>
            <input type="hidden" id="amount-for-ws" value="{{ amount }}">
            <input type="hidden" id="uuid-for-ws" value="{{ uuid }}">
            <input type="hidden" id="choos-pay-for-ws" value="{{ payement_choice_id }}">
        </section>
      </div>

    </main>

    
    <script>
        
let socket;

function connectWebSocket() {
    if (socket && socket.readyState === WebSocket.OPEN) {
        console.log("WebSocket already connected");
        return;
    }

    socket = new WebSocket('ws://127.0.0.1:8010/')//, 'echo-protocol');
    
    console.log("WebSocket connecting to:", "your-server-ip:8010");
    
    socket.onopen = () => {
        console.log("WebSocket connected successfully");
        const uuid = document.querySelector("#uuid-for-ws").value;
        const amount = document.querySelector("#amount-for-ws").value;
        const dt = { "amount": amount, "uuid": uuid };
        const data = { "message": "htmlClient", 'data': dt };
        
        // Send data only after connection is confirmed stable
        setTimeout(() => {
            socket.send(JSON.stringify(data));
        }, 500); // Small delay to ensure connection stability
    };

    socket.onmessage = async (event) => {
        try {
            const parsedMsg = JSON.parse(event.data);
            console.log("MSG received: ", parsedMsg.received_bill)
            
            if (parsedMsg.received_bill === "Bill recived") {
                const uuid = document.querySelector("#uuid-for-ws").value;
                const amount = document.querySelector("#amount-for-ws").value;
                const payement_choice_id = document.querySelector("#choos-pay-for-ws").value;
                
                const send_dt = {
                    'uuid': uuid,
                    'bill': parsedMsg.bill,
                    "amount": amount,
                    "payement_choice_id": payement_choice_id
                };
                
                try {
                    const response = await fetch("http://glencho.casacam.net:57347/api/card/devices_bill/", {
                        method: "POST",
                        body: JSON.stringify(send_dt),
                        headers: { 
                            "Content-type": "application/json; charset=UTF-8"
                        }
                    });
                    
                    const data = await response.json();
                    document.getElementById('main-payement').innerHTML = data.html;
                    
                    if (data.complete === 'yes') {
                        initializePaymentConfirmation(10000, 'lastPage');
                    }
                } catch (error) {
                    console.error('Fetch Error:', error);
                }
            }
        } catch (error) {
            console.error('Message Parsing Error:', error);
        }
    };

    socket.onerror = (error) => {
        console.error("WebSocket error:", error);
        if (socket.readyState !== WebSocket.CLOSED) {
            socket.close();
        }
    };
}

// Initialize connection
connectWebSocket();


    </script>

{% endblock content %}
